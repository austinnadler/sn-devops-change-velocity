  #         distribution: ${{ env.JAVA_DISTRIBUTION }}
  #         java-version: ${{ env.JAVA_VERSION }}
  #         cache: maven

  #     - name: Download application artifact
  #       uses: actions/download-artifact@v8
  #       with:
  #         name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
  #         path: dist

  #     # Change receipt: step has Change receipt = true in ServiceNow, so the change is
  #     # created with pipeline data and the action returns immediately (no pause).
  #     - name: ServiceNow Change Receipt
  #       uses: ServiceNow/servicenow-devops-change@v7.1.0
  #       with:
  #         devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
  #         instance-url: ${{ secrets.SN_INSTANCE_URL }}
  #         tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
  #         context-github: ${{ toJSON(github) }}
  #         job-name: 'Deploy DEV'
  #         change-request: >-
  #           {
  #             "setCloseCode": "true",
  #             "autoCloseChange": true,
  #             "attributes": {}
  #           }
  #         interval: '100'
  #         timeout: '3600'
  #         changeCreationTimeOut: '3600'
  #         abortOnChangeCreationFailure: true
  #         abortOnChangeStepTimeout: true

  #     # Simulated deployment: runs the jar on the runner. Replace with the real
  #     # deploy step (e.g. Azure Web App, Kubernetes, VM) for a customer pipeline.
  #     - name: Deploy to DEV
  #       run: bash scripts/deploy-local.sh "dist/${APP_NAME}.jar" "${APP_PORT}" "${TARGET_ENV}"

  #     - name: Run smoke tests against DEV
  #       run: mvn -B -ntp test -Psmoke -Drevision=${{ env.APP_VERSION }} -Dsmoke.baseUrl=http://localhost:${{ env.APP_PORT }}

  #     - name: ServiceNow DevOps Unit Test Results
  #       if: always() && hashFiles('target/surefire-reports/*.xml') != ''
  #       uses: ServiceNow/servicenow-devops-test-report@v7.1.0
  #       with:
  #         devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
  #         instance-url: ${{ secrets.SN_INSTANCE_URL }}
  #         tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
  #         context-github: ${{ toJSON(github) }}
  #         job-name: 'Deploy DEV'
  #         xml-report-filename: target/surefire-reports
  #         test-summary-name: 'Smoke Tests DEV - ${{ env.APP_VERSION }}'

  #     - name: Stop application
  #       if: always()
  #       run: bash scripts/stop-local.sh

  # -------------------------------------------------------------------------
  deploy-test:
    name: Deploy TEST
    # needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test
    env:
      TARGET_ENV: test
      APP_PORT: '8080'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: dist

      # Change receipt: step has Change receipt = true in ServiceNow, so the change is
      # created with pipeline data and the action returns immediately (no pause).
      - name: ServiceNow Change Receipt
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy TEST'
          change-request: >-
            {
              "setCloseCode": "true",
              "autoCloseChange": true,
              "attributes": {}
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Deploy to TEST
        run: bash scripts/deploy-local.sh "dist/${APP_NAME}.jar" "${APP_PORT}" "${TARGET_ENV}"

      - name: Run smoke tests against TEST
        run: mvn -B -ntp test -Psmoke -Drevision=${{ env.APP_VERSION }} -Dsmoke.baseUrl=http://localhost:${{ env.APP_PORT }}

      - name: ServiceNow DevOps Unit Test Results
        if: always() && hashFiles('target/surefire-reports/*.xml') != ''
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy TEST'
          xml-report-filename: target/surefire-reports
          test-summary-name: 'Smoke Tests TEST - ${{ env.APP_VERSION }}'

      - name: Stop application
        if: always()
        run: bash scripts/stop-local.sh

  # -------------------------------------------------------------------------
  # Must be in a job before the change job so the package links to the
  # pipeline execution the change request is created for.
  register-package:
    name: Register Package
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ServiceNow Register Package
        uses: ServiceNow/servicenow-devops-register-package@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Register Package'
          artifacts: '[{"name": "${{ env.APP_NAME }}.jar", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'
          package-name: '${{ env.APP_NAME }}-${{ env.APP_VERSION }}'

  # -------------------------------------------------------------------------
  # Creates a type-based (Normal) change. With deployment-gate set, this step
  # does not poll; the "production" environment's ServiceNow deployment
  # protection rule holds "Deploy PROD" until the change reaches Implement.
  change:
    name: ServiceNow Change
    needs: register-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      change-request-number: ${{ steps.create.outputs.change-request-number }}
    steps:
      - name: ServiceNow Change
        id: create
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change'
          change-request: >-
            {
              "setCloseCode": "true",
              "autoCloseChange": true,
              "attributes": {}
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true
          deployment-gate: '{"environment": "production", "jobName": "Deploy PROD"}'

  # -------------------------------------------------------------------------
  deploy-prod:
    name: Deploy PROD
    needs: change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      TARGET_ENV: prod
      APP_PORT: '8080'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: dist

      - name: Deploy to PROD
        run: bash scripts/deploy-local.sh "dist/${APP_NAME}.jar" "${APP_PORT}" "${TARGET_ENV}"

      - name: Post-deployment verification
        run: mvn -B -ntp test -Psmoke -Drevision=${{ env.APP_VERSION }} -Dsmoke.baseUrl=http://localhost:${{ env.APP_PORT }}

      - name: Stop application
        if: always()
        run: bash scripts/stop-local.sh

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### ${APP_NAME} ${APP_VERSION} → production"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Change request | ${{ needs.change.outputs.change-request-number }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Package | ${APP_NAME}-${APP_VERSION} |"
            echo "| Job status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
