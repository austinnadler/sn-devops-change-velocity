# ---------------------------------------------------------------------------
# build-and-deploy
#
# CI/CD pipeline integrated with ServiceNow DevOps Change Velocity.
#
#   Build ──► Deploy DEV ──► Deploy TEST ──► Register Package ──► ServiceNow Change ──► Deploy PROD
#   (unit tests,  (change        (change         (package of the      (type-based Normal     (held by the
#    register      receipt +      receipt +       registered artifact)  change + deployment    ServiceNow deployment
#    artifact)     smoke tests)   smoke tests)                          gate)                  protection rule)
#
# ServiceNow DevOps rules this file follows (see docs/SETUP.md for sources):
#   - Workflow `name` must match the file name (build-and-deploy).
#   - Every job has a unique display `name`; each ServiceNow action's `job-name` must equal it.
#   - Jobs run sequentially: DevOps change automation is not supported for parallel jobs.
#   - Package registration runs in a job BEFORE the change job.
# ---------------------------------------------------------------------------
name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: cancel superseded runs. main: queue deployments, never cancel one mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  APP_NAME: austin-devops-demo
  APP_VERSION: 1.0.${{ github.run_number }}
  # ServiceNow reporting is skipped on pull requests (fork PRs can't read secrets, and
  # PR runs would add noise to the pipeline/DORA data). CI still runs on every PR.
  SN_REPORT: ${{ github.event_name != 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and run unit tests
        run: mvn -B -ntp verify -Drevision=${{ env.APP_VERSION }}

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: ServiceNow DevOps Unit Test Results
        # Only report when Surefire actually produced results (skips compile/setup failures)
        if: always() && env.SN_REPORT == 'true' && hashFiles('target/surefire-reports/*.xml') != ''
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: target/surefire-reports
          test-summary-name: 'Unit Tests - ${{ env.APP_VERSION }}'

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: target/${{ env.APP_NAME }}.jar
          retention-days: 30
          if-no-files-found: error

      - name: ServiceNow Register Artifact
        if: env.SN_REPORT == 'true'
        uses: ServiceNow/servicenow-devops-register-artifact@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          artifacts: '[{"name": "${{ env.APP_NAME }}.jar", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'

  # -------------------------------------------------------------------------
  # deploy-dev:
