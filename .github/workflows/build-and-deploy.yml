# ---------------------------------------------------------------------------
# Minimal GitHub Actions pipeline for ServiceNow DevOps Change Velocity.
#
#   Build ──► ServiceNow Change ──► Deploy PROD
#
# Shows the 5 integration points: test results, artifact, package, change, gated deploy.
# Build/test/deploy commands are placeholders. Replace them with your real steps.
#
# Prerequisites
#   GitHub repo secrets:
#     SN_INSTANCE_URL              https://<instance>.service-now.com
#     SN_ORCHESTRATION_TOOL_ID     sys_id of the GitHub tool in ServiceNow
#     SN_DEVOPS_INTEGRATION_TOKEN  token from the GitHub tool record (Copy token)
#   GitHub environment "production" with the ServiceNow GitHub App selected
#   under Deployment protection rules.
#   ServiceNow: "Deploy PROD" pipeline step has Change control enabled.
#
# Rules
#   - Workflow `name` must match the file name.
#   - Each ServiceNow action's `job-name` must equal its job's display `name`.
#   - Register the package in a job BEFORE the change job.
#   - setCloseCode / autoCloseChange must be booleans, not strings.
# ---------------------------------------------------------------------------
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: sample-app
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Placeholder: replace with your build + test (e.g. mvn verify). Surefire
      # writes JUnit XML to target/surefire-reports; TestNG writes
      # target/surefire-reports/testng-results.xml.
      - name: Build and test (placeholder results)
        run: |
          mkdir -p test-results
          cat > test-results/unit-tests.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="UnitTests" tests="3" failures="0" errors="0" skipped="0" time="0.5">
            <testcase classname="SampleTest" name="test1" time="0.1"/>
            <testcase classname="SampleTest" name="test2" time="0.2"/>
            <testcase classname="SampleTest" name="test3" time="0.2"/>
          </testsuite>
          EOF

      # 1. Test results (JUnit XML file or directory, or a TestNG results file)
      - name: ServiceNow DevOps Unit Test Results
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: test-results/unit-tests.xml

      # 2. Artifact version produced by this build
      - name: ServiceNow Register Artifact
        uses: ServiceNow/servicenow-devops-register-artifact@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          artifacts: '[{"name": "${{ env.APP_NAME }}", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'

      # 3. Package = the artifact version(s) being released
      - name: ServiceNow Register Package
        uses: ServiceNow/servicenow-devops-register-package@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          artifacts: '[{"name": "${{ env.APP_NAME }}", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'
          package-name: '${{ env.APP_NAME }}-${{ env.APP_VERSION }}'

  # 4. Registers the deployment gate. The change request is created when
  #    "Deploy PROD" hits the production environment's protection rule.
  change:
    name: ServiceNow Change
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change'
          change-request: '{"setCloseCode": true, "autoCloseChange": true, "attributes": {}}'
          deployment-gate: '{"environment": "production", "jobName": "Deploy PROD"}'

  # 5. Held by ServiceNow until the change reaches Implement.
  deploy-prod:
    name: Deploy PROD
    needs: change
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy (placeholder)
        run: echo "Deploying ${APP_NAME} ${APP_VERSION} to production"
